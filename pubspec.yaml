name: jamal_flutter_app
description: Personal Schedule & Productivity Reminder App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  get_storage: ^2.1.1
  flutter_screenutil: ^5.9.3
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.0
  flutter_timezone: ^5.0.0
  intl: ">=0.19.0 <0.21.0"
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
